services:
  api:
    image: ${DOCKERHUB_NAMESPACE:-bailianhua}/relay-api:${IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./jingle.mp3:/app/jingle.mp3:ro
      - relay-data:/app/data
    expose:
      - "3001"

  web:
    image: ${DOCKERHUB_NAMESPACE:-bailianhua}/relay-web:${IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api

volumes:
  relay-data:
